# Fast security checks on every pull request and push: no secrets in the history, and no
# dependency with a known serious advisory that a newer release fixes.
name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a new advisory against a dependency we already use still turns up.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.1
  OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8

jobs:
  # Scans every commit for keys, tokens and passwords. If a test fixture ever trips it, list
  # its fingerprint, with the reason, in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        timeout-minutes: 2
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the history for secrets
        timeout-minutes: 5
        # --redact keeps any value it finds out of the log.
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'

  # OSV-Scanner over every lockfile (today: plugins/bridge/package-lock.json).
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        timeout-minutes: 2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfiles
        timeout-minutes: 5
        # Exit 1 only means it found something; the gate below decides what fails the build.
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source -r --format json --output-file "$RUNNER_TEMP/osv.json" .
          code=$?
          if [ "$code" -gt 1 ]; then echo "::error::OSV-Scanner failed (exit $code)"; exit "$code"; fi
      - name: Fail on fixable HIGH or CRITICAL advisories
        timeout-minutes: 1
        run: python3 .github/scripts/osv_gate.py "$RUNNER_TEMP/osv.json"
