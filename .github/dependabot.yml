# Weekly update pull requests, grouped so a week's bumps arrive as one or two PRs.
# A bump to the bridge's packages needs `npm run build` in plugins/bridge too: ci checks the
# committed bin/*.mjs against the source, so it stays red until the bundle is rebuilt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /plugins/bridge
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      bridge:
        patterns: ['*']
