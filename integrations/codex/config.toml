# Wildware Feed for Codex. Add this to ~/.codex/config.toml (or .codex/config.toml in a trusted project)
# and change https://dashboard.example.com to your dashboard. Codex reads the token from AGENT_DASHBOARD_TOKEN when it starts.
# Generated by plugins/bridge/integrations.mjs.
[mcp_servers.agent-dashboard]
url = "https://dashboard.example.com/mcp"
bearer_token_env_var = "AGENT_DASHBOARD_TOKEN"
